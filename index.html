<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ECECEC"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>cctv-report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Clean desktop look: system fonts (Segoe UI / Leelawadee UI), light gray page, white panels, flat controls */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --fill:#F7F8FA; --ink:#1F2328; --muted:#5F6670; --line:#D5D9DF; --line2:#E7EAEE; --r:6px; --sh:0 1px 2px rgba(16,24,40,.06);
  --accent:#0A58CA; --accent-2:#084298; --accent-soft:#DCE8FA; --accent-ink:#FFFFFF;
  --folder:#E0A82E; --danger:#B00020; --danger-soft:#FBE9EB; --ok:#1B7F3B;
  --f:'Segoe UI','Leelawadee UI',Tahoma,'Microsoft Sans Serif',Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;margin:0;padding:10px 14px 40px}
.wrap{max-width:1600px;margin:0 auto}
h1,h2,h3{font-family:var(--f);margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(10,88,202,.15);background:#fff!important}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--sh);padding:8px 14px}
.bar h1{font-size:18px;font-weight:700}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;flex:0 0 auto}
.brand span{font-size:20px;font-weight:700;color:var(--ink)}
.brand b{font-weight:700;color:var(--accent)}
.bar .brand+.sub{margin:0}
.bar .sub{color:var(--muted);font-size:12px;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools input[type=date]{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:3px 8px;height:30px}
.btn{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:3px 12px;min-height:30px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--fill);border-color:#B9C0CA}
.btn:active{background:#EEF1F5}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.seg{display:inline-flex;gap:2px;background:#EBEDF0;border-radius:var(--r);padding:2px}
.seg button{border:0;background:transparent;border-radius:4px;padding:3px 12px;min-height:26px;color:var(--muted)}

.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:#fff;color:var(--accent-2);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.totals{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin:6px 0 0;color:var(--muted);font-size:13px;padding:0 2px}
.totals b{font-weight:bold;color:var(--ink);margin-right:3px}

/* layout */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:10px;margin-top:8px;align-items:start}
.side{position:sticky;top:8px;display:flex;flex-direction:column;max-height:calc(100vh - 16px);min-width:0;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--sh);padding:6px}
.rail{display:flex;flex-direction:column;overflow:auto;min-width:0;min-height:0}
.rail button.f{display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 6px;align-items:center;text-align:left;background:transparent;border:0;border-radius:var(--r);padding:4px 6px}
.rail button.f:hover{background:var(--fill)}
.rail button.f[aria-current=true]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.rail button.f[aria-current=true] .fn{font-weight:600;color:var(--accent-2)}
.rail .fn{overflow-wrap:anywhere;line-height:1.3}
.rail .fm{grid-column:2;color:var(--muted);font-size:11.5px}
.rail .addp{margin-top:6px}
.rail .gh{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--muted);padding:10px 6px 2px}
.rail button.f.zero .fn{color:var(--muted)}
.ficon{width:18px;height:14px;fill:var(--folder)}
.shift{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.shift .seg{display:flex;width:100%}
.shift .seg button{flex:1;padding:2px 4px;font-size:13px}
.shift .msg{margin:4px 2px 0;font-size:11.5px;line-height:1.4}

/* project boxes */
.proj{background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.proj>header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:6px 10px;background:var(--fill);border-bottom:1px solid var(--line2)}
.pname{flex:1 1 200px;min-width:0;font-weight:600;font-size:15px;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:2px 6px}
.pname:hover{border-color:var(--line)}
.cnt{font-size:12px;color:var(--accent-2);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.ghost{background:transparent;border:0;border-radius:var(--r);color:var(--muted);padding:3px 8px;font-size:13px}
.ghost:hover{color:var(--ink);background:#EEF1F5}
.ghost.armed{color:#fff;background:var(--danger)}
.case{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:4px 8px;padding:6px 10px;border-top:1px solid var(--line2);align-items:start}
.proj>header+.case{border-top:0}
.case input[type=time]{border:1px solid transparent;border-radius:var(--r);background:var(--accent-soft);padding:2px 6px;height:30px;width:100%;font-weight:600;color:var(--accent-2)}
.case textarea{display:block;width:100%;resize:none;overflow:hidden;background:var(--fill);border:1px solid var(--line2);border-radius:var(--r);padding:4px 8px;height:30px;min-height:30px;line-height:20px}
.photos{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.thumb{position:relative;width:88px;height:66px;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:#f4f4f4}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(20,24,30,.65);color:#fff;font-size:12px;line-height:1;padding:0}
.thumb .cp{position:absolute;left:3px;bottom:3px;border:0;border-radius:999px;background:rgba(20,24,30,.65);color:#fff;font-size:11px;padding:0 6px}
.addph{display:inline-flex;align-items:center;gap:4px;height:66px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r);color:var(--muted);font-size:12.5px;cursor:pointer;background:transparent}
.addph.sm{height:24px;padding:0 10px;border-radius:999px}
.addph:hover,.addph.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.addph input{display:none}
button.addph{font:inherit;font-size:12.5px}
.case.target{background:#F3F8FF;box-shadow:inset 3px 0 0 var(--accent)}
.addc{margin:4px 10px 10px}
.rowb.addc{margin-top:6px}
.msel{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:2px 6px;height:28px;font-size:13px}
.ca{grid-column:3;grid-row:1;display:flex;gap:2px}
.quiet{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:10px;margin-bottom:10px}
.quiet h3{font-size:14px;font-weight:bold;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12.5px}
.chip:hover{background:var(--accent-soft);border-color:#AFC6EE;color:var(--accent-2)}
.empty{padding:16px 8px;color:var(--muted);text-align:center}
.msg{color:var(--muted);font-size:12.5px}

/* backup status */
.pill{display:inline-flex;align-items:center;gap:6px;margin-left:auto;background:#fff;border:1px solid var(--line2);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--muted);min-height:24px}
.pill i{width:8px;height:8px;border-radius:50%;background:#999;flex:0 0 auto}
.pill.ok i{background:var(--ok)}
.pill.wait i,.pill.busy i{background:#D99A00}
.pill.err{color:var(--danger)}.pill.err i{background:var(--danger)}
.sheet .pill{margin:6px 0 0}

/* report + data pages */
.sheet{background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--sh);padding:14px 18px;max-width:1200px;margin:8px auto 0}
.sheet+.sheet{margin-top:8px}
.sheet .kick{font-size:12px;color:var(--muted);margin:0}
.sheet h2{font-size:20px;font-weight:700;margin:2px 0}
.sheet .tot{color:var(--muted);margin:0 0 4px}
.sheet header{border-bottom:1px solid var(--line2);padding-bottom:10px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 10px;margin-top:8px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label,.rn label{font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.rn input{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:2px 8px;height:30px;width:100%}
.rn{display:flex;flex-direction:column;gap:2px;margin-top:6px;max-width:320px}
textarea.mp{display:block;width:100%;border:1px solid var(--line2);border-radius:8px;resize:vertical;min-height:100px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f);font-size:14px;line-height:1.6;background:var(--fill);padding:8px 10px;margin:4px 0 6px;overflow:hidden}
pre.mp{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f);font-size:14px;line-height:1.6;background:#fff;border:1px solid var(--line);padding:6px 8px;margin:6px 0}
.mphead{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:8px}
.mphead .ed{display:none}
.sp.edited .mphead .ed{display:inline-flex}
.mphead .tag{background:#FFF3CD;border:0;border-radius:999px;color:#7A5A00;padding:0 8px;font-size:12px;align-items:center}
.sp{padding:12px 0;border-bottom:1px solid var(--line2)}
.sp:last-child{border-bottom:0}
.sp h3{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:16px;font-weight:600}
.sp h3 small{font-weight:normal;font-size:12.5px;color:var(--muted)}
.sp h3 .btn{font-size:13px;font-weight:normal}
.sp h3 .btn.pri{font-weight:bold}
.sp.done h3>span[data-pn]::after{content:' ✓';color:var(--ok)}
.proj.done>header{background:#EEF8F1}
.proj.done>header .pname::after{content:''}
.sp.done{background:linear-gradient(90deg,#F2FAF4,transparent 60%)}
.hbtn{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.btn.line{background:#06C755;border-color:#06C755;color:#fff;font-weight:600}
.btn.line:hover{background:#05B04B;border-color:#05B04B}
.sentb[aria-pressed=true]{background:#E3F4E8;border-color:#A9D8B7;color:var(--ok);font-weight:600}
.btn.step{background:#2B3138;border-color:#2B3138}
.tl{margin-top:6px}
.phh{margin-top:2px}
.sp ul{list-style:none;margin:6px 0 0;padding:0}
.sp li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:2px 8px}
.sp time{color:var(--accent);font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:4px}
.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;border-radius:var(--r)}
.ph{position:relative;margin:0}
.ph figcaption{font-size:12px;color:var(--muted)}
.ph .cpimg{position:absolute;right:6px;bottom:26px;border:0;border-radius:999px;background:rgba(20,24,30,.65);color:#fff;font-size:11.5px;padding:1px 8px}
.pend{color:var(--muted)}
.pend b{color:var(--ink)}
.prog{margin-top:12px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);padding:12px 14px 14px}
.prog:empty{display:none}
.progtop{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.progtop b{font-size:15px;font-weight:700}
.progtop .pct{margin-left:auto;font-size:13px;font-weight:700;color:var(--ok);background:#E3F4E8;border-radius:999px;padding:1px 10px}
.okmsg{color:var(--ok);font-weight:700}
.progtop .left{color:#9A5B00;font-weight:600;font-size:13px}
.bar2{height:10px;border-radius:999px;background:#E7EAEE;overflow:hidden;margin:8px 0 4px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#2E9E55,var(--ok));border-radius:999px;transition:width .35s}
.pgrp{margin-top:12px;padding:10px 12px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--fill)}
.pgrp.wait{background:#FFFBF0;border-color:#F0DDB0}
.pgrp.ok{background:#F3FAF5;border-color:#CFE8D8}
.pgh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:8px}
.pgh::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.pgh em{font-style:normal;font-weight:600;font-size:12px;border-radius:999px;padding:0 8px;background:#fff;border:1px solid currentColor}
.pgrp.wait .pgh{color:#9A5B00}
.pgrp.ok .pgh{color:var(--ok)}
.pgrp .chips{gap:6px}
.pgrp .chip{padding:3px 12px;line-height:1.4;transition:background .12s,border-color .12s,transform .08s}
.pgrp .chip:active{transform:scale(.97)}
.pgrp.wait .chip{background:#fff;border-color:#E8C77E}
.pgrp.wait .chip:hover{background:#FFF1D6;border-color:#D9A93F;color:#7A4800}
.pgrp.ok .chip.sent:hover{background:#D5EEDC;border-color:#7CC194}
.chip.sent{background:#E3F4E8;border-color:#A9D8B7;color:var(--ok)}
.dsec{padding:10px 0;border-bottom:1px solid var(--line2)}
.dsec:last-child{border-bottom:0;padding-bottom:0}
.dsec h3{font-size:14px;font-weight:bold}
.dsec p{margin:2px 0 0;color:var(--muted);font-size:13px}
.rowb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:#7A0016}
.btn:disabled,.ghost:disabled{opacity:.45;cursor:default}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:middle}
.tbl td:first-child{white-space:nowrap}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .acts{white-space:nowrap;text-align:right}
.scroll{overflow-x:auto}
.import{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:10px;margin-top:10px}
.import textarea{width:100%;min-height:140px;border:1px solid var(--line);padding:6px}
.tin{border:1px solid var(--line);border-radius:var(--r);padding:2px 6px;height:30px}

/* overlays */
#toast{position:fixed;right:16px;bottom:16px;background:#2B3138;color:#fff;border-radius:8px;padding:8px 14px;z-index:60;max-width:calc(100% - 32px);font-size:13px;box-shadow:0 6px 20px rgba(16,24,40,.25)}
.totals .clr{color:var(--danger)}
.totals .clr:hover{background:var(--danger-soft);color:var(--danger)}
.sentok{font-size:11.5px;font-weight:600;color:var(--ok);white-space:nowrap}
#msgdlg{position:fixed;inset:0;z-index:80;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#msgdlg .mbox{background:#fff;border-radius:10px;box-shadow:0 16px 48px rgba(16,24,40,.3);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
#msgdlg .mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2)}
#msgdlg .mtext{margin:0;padding:14px 18px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f);font-size:14px;line-height:1.65;flex:1 1 auto}
#msgdlg .mfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line2)}
#msgdlg .mfoot .msg{margin-right:auto}
.ctx{position:fixed;z-index:70;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.18);padding:4px}
.ctx .ctxsep{height:1px;background:var(--line2);margin:4px 0}
.ctx .ctxh{padding:6px 10px 4px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line2);margin-bottom:4px;overflow-wrap:anywhere}
.ctx button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:6px 10px}
.ctx button:hover:not(:disabled){background:var(--fill)}
.ctx button:disabled{color:#AAA;cursor:default}
.ctx button.dz{color:var(--danger)}
.ctx button[data-armed]{background:var(--danger);color:#fff}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
#lbcopy{position:absolute;bottom:20px;left:50%;transform:translateX(-50%)}

/* small windows / phone: stack */
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .rail{flex-direction:row;overflow-x:auto;gap:4px}
  .rail button.f{flex:0 0 auto;max-width:200px;border-color:var(--line2)}
  .rail .gh{flex:0 0 auto;align-self:center;border:0}
  .rail .addp{margin:0;flex:0 0 auto}
  .pill{margin-left:0}
}
@media (max-width:600px){
  .case{grid-template-columns:minmax(0,1fr) auto}
  .ca{grid-column:2}
  .case textarea{grid-column:1 / 3;grid-row:2}
  .photos{grid-column:1 / 3}
  .pname{flex:1 1 100%}
}

/* ===== folder UI (image-style) ===== */
:root{--fb:#2b4a4c;--ft:#8fbdba;--fu:#3a6264}
.rail button.f{grid-template-columns:22px minmax(0,1fr) auto;border-radius:12px;padding:7px 8px;gap:0 10px}
.rail button.f[aria-current=true]{background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08),0 4px 14px rgba(16,24,40,.08)}
.rail .fm{grid-column:auto;font-size:12px;order:3;white-space:nowrap}
.rail .fn{order:2}.rail .ficon{order:1}
.ficon{width:22px;height:17px}
.fgrid{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px;scroll-snap-type:x proximity}
.fgrid h3{display:none}
.fcard{flex:0 0 190px;scroll-snap-align:start;background:transparent;border:0;border-radius:20px;padding:10px 10px 12px;text-align:center;transition:background .15s}
.fcard:hover{background:var(--fill)}
.fcard .nm{display:block;font-weight:600;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .mt{display:block;color:var(--muted);font-size:12px}
.fart{position:relative;height:104px;margin:0 4px}
.fart i{position:absolute;display:block}
.fart .bk{left:5%;right:5%;top:16px;bottom:0;border-radius:12px;background:var(--fb)}
.fart .bk:before{content:"";position:absolute;left:0;top:-10px;width:42%;height:14px;border-radius:9px 9px 0 0;background:var(--fb)}
.fart .p1,.fart .p2{background:#fff;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.14);height:60px;width:42%;top:0;transition:transform .25s}
.fart .p1{left:16%;transform:rotate(-5deg)}.fart .p2{left:42%;top:5px;transform:rotate(4deg)}
.fart .p1:before,.fart .p2:before{content:"";position:absolute;left:8px;right:12px;top:11px;height:3px;border-radius:3px;background:#d5d3e6;box-shadow:0 9px 0 #e6e5ef,0 18px 0 #e6e5ef}
.fcard:hover .p1{transform:rotate(-8deg) translateY(-5px)}.fcard:hover .p2{transform:rotate(7deg) translateY(-6px)}
.fart .ft{left:0;right:0;bottom:0;height:58px;border-radius:14px;background:linear-gradient(180deg,var(--ft),var(--fu));box-shadow:0 7px 14px -6px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.fart .pl{position:absolute;right:8px;bottom:8px;font-size:11.5px;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.3);color:#fff}

function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s).replace(/[\s\-_.,\/]+/g,'').toUpperCase()}

/* ---------- parsing ---------- */
function parse(text){
  var out=[],cur=null;
  text.split(/\r?\n/).forEach(function(raw){
    var line=raw.replace(/^[\s♦◆◇•▪\-*•️]+/,'').trim();
    if(!line)return;
    var h=line.match(/^โครงการ\s+(.+?)\s*(?:จำนวน\s*\d+\s*เคส)?\s*$/);
    if(h&&!/^เวลา/.test(line)){cur={name:h[1].trim(),cases:[]};out.push(cur);return}
    var c=line.match(/^เวลา\s*(\d{1,2})\s*[.:]\s*(\d{2})\s*น?\.?\s*(.*)$/);
    if(c){
      if(!cur){cur={name:'ไม่ระบุโครงการ',cases:[]};out.push(cur)}
      cur.cases.push({id:uid(),time:('0'+c[1]).slice(-2)+':'+c[2],text:'♦️ '+line});
    }else if(cur&&cur.cases.length){cur.cases[cur.cases.length-1].text+=' '+line}
  });

var LEAD=/^[\s♦◆◇•▪\-*\u2022\ufe0f]+/;

  var out=[],lead=[];
  String(text||'').split(/\r?\n/).forEach(function(l){
    var m=l.match(TP);
    if(m){out.push({time:('0'+m[1]).slice(-2)+':'+m[2],full:'♦️ '+l.replace(LEAD,'').trim()})}
    else if(out.length){if(l.trim())out[out.length-1].full+=' '+l.trim()}

  });

}

var SY={busy:false,timer:null,err:'',again:false};
function syOn(){var s=store.sync;return !!(s.url&&s.key&&s.on!==false)}
function markP(p){p.cases.forEach(function(c){store.sync.dirty[c.id]=++store.sync.n});schedule()}
function markDel(c){delete store.sync.dirty[c.id];store.sync.dels[c.id]=1;schedule()}
function schedule(){clearTimeout(SY.timer);if(syOn())SY.timer=setTimeout(flush,2500);paintSync()}
function caseIndex(){var m={};allCases(function(c,p,d){m[c.id]={c:c,p:p,d:d}});return m}
function unsyncedPhotos(dates){var idx=caseIndex(),out=[];Object.keys(photoMap).forEach(function(k){var o=idx[k];if(!o||(dates&&dates.indexOf(o.d)<0))return;photoMap[k].forEach(function(x){if(!x.fileId)out.push({x:x,o:o})})});return out}
function dirtyIn(dates){var idx=caseIndex(),n=0;Object.keys(store.sync.dirty).forEach(function(i){var o=idx[i];if(o&&bodyText(o.c)&&(!dates||dates.indexOf(o.d)>=0))n++});return n}
function pending(){var s=store.sync;return dirtyIn(null)+Object.keys(s.dels).length+Object.keys(s.pdels).length+unsyncedPhotos().length}
function caseRow(o){return{id:o.c.id,date:o.d,project:o.p.name||'ไม่ระบุโครงการ',mode:MODES[o.p.mode||'']||'',time:o.c.time,text:caseText(o.c)}}
function post(body){
  body.key=store.sync.key;
  var url=String(store.sync.url||'').trim();
  if(!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[^/]+\/exec$/.test(url))return Promise.reject(new Error('ลิงก์ต้องเป็นลิงก์ Web App ที่ลงท้ายด้วย /exec (ไม่ใช่ลิงก์ /dev หรือลิงก์หน้าแก้โค้ด)'));
  return fetch(url,{method:'POST',body:JSON.stringify(body)})
    .then(function(r){return r.text().then(function(t){return {status:r.status,text:t}})},function(){throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต หรือ Web App ยังไม่ได้ตั้ง "ผู้มีสิทธิ์เข้าถึง: ทุกคน"')})
    .then(function(res){
      var t=res.text||'',j=null;try{j=JSON.parse(t)}catch(e){}
      /* explain what came back, so a wrong setup is easy to spot */
      if(!j){
        if(/<html|<!DOCTYPE/i.test(t)){
          if(/accounts\.google|ServiceLogin|signin/i.test(t))throw new Error('Google ขอให้ล็อกอิน: ตอน Deploy ต้องเลือก "ผู้มีสิทธิ์เข้าถึง: ทุกคน"');
          if(/doPost|Script function not found/i.test(t))throw new Error('สคริปต์ไม่มีฟังก์ชัน doPost: วางโค้ด Code.gs ไม่ครบ หรือ Deploy ก่อนวางโค้ด');
          throw new Error('สคริปต์ตอบกลับเป็นหน้าเว็บ ไม่ใช่ข้อมูล (สถานะ '+res.status+'): ตรวจว่า Deploy เป็น "เว็บแอป" และ Deploy เวอร์ชันใหม่หลังวางโค้ด');
        }
        throw new Error('สคริปต์ไม่ได้ตอบกลับ (สถานะ '+res.status+')');
      }
      if(j.ok)return j;
      if(j.error)throw new Error(j.error);
      throw new Error('ลิงก์นี้ไม่ใช่สคริปต์ของ CCTV Report: ได้คำตอบ '+t.slice(0,80)+' ให้วางโค้ด Code.gs แล้ว Deploy เวอร์ชันใหม่');
    });
}
function flush(){
  clearTimeout(SY.timer);
  if(!syOn())return Promise.resolve();
  if(SY.busy){SY.again=true;return Promise.resolve()}
  SY.busy=true;SY.err='';paintSync();
  var s=store.sync;
  return Promise.resolve().then(function(){
    var ids=Object.keys(s.dels);if(!ids.length)return;
    return post({action:'deleteCases',ids:ids}).then(function(){ids.forEach(function(i){delete s.dels[i]});save()});
  }).then(function(){
    var ids=Object.keys(s.pdels);if(!ids.length)return;
    return post({action:'deletePhotos',ids:ids}).then(function(){ids.forEach(function(i){delete s.pdels[i]});save()});
  }).then(function(){
    var idx=caseIndex(),list=[],stamp={},chain=Promise.resolve();
    Object.keys(s.dirty).forEach(function(i){var o=idx[i];if(o&&bodyText(o.c)){list.push(caseRow(o));stamp[i]=s.dirty[i]}else delete s.dirty[i]});
    for(var k=0;k<list.length;k+=150)(function(part){chain=chain.then(function(){return post({action:'upsertCases',cases:part}).then(function(){part.forEach(function(r){if(s.dirty[r.id]===stamp[r.id])delete s.dirty[r.id]});save();paintSync()})})})(list.slice(k,k+150));
    return chain;
  }).then(function(){
    var chain=Promise.resolve();
    unsyncedPhotos().forEach(function(u){chain=chain.then(function(){
      if(u.x.fileId)return;
      return post({action:'uploadPhoto',photo:{id:u.x.id,caseId:u.o.c.id,date:u.o.d,project:u.o.p.name||'ไม่ระบุโครงการ',time:u.o.c.time,data:u.x.data}}).then(function(j){
        u.x.fileId=j.fileId;u.x.url=j.url;tx('readwrite',function(st){return st.put(u.x)});paintSync();
      });
    })});
    return chain;
  }).then(function(){s.last=Date.now();save()},function(e){SY.err=(e&&e.message)||'ส่งไม่สำเร็จ';SY.timer=setTimeout(flush,30000)})
  .then(function(){SY.busy=false;paintSync();if(SY.again){SY.again=false;schedule()}});
}

document.addEventListener('change',function(e){
  var t=e.target;if(!t.hasAttribute)return;
  if(t.hasAttribute('data-fph')){fonlyPh=t.checked;render();return}
  var r=t.getAttribute('data-frange');if(r){if(r==='from')fFrom=t.value;else fTo=t.value;if(fFrom&&fTo&&fFrom>fTo){var x=fFrom;fFrom=fTo;fTo=x}render()}
});
document.addEventListener('click',function(e){
  var q=e.target.closest&&e.target.closest('[data-fq]');if(!q)return;
  var k=q.dataset.fq;fTo=k==='all'?'':store.date;fFrom=k==='all'?'':k==='d1'?store.date:k==='d7'?isoAdd(-6):k==='d30'?isoAdd(-29):store.date.slice(0,8)+'01';render();
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t.hasAttribute||!t.hasAttribute('data-search'))return;
  pq=t.value.trim();
  Array.prototype.forEach.call(document.querySelectorAll('[data-pqx]'),function(x){x.hidden=!pq});
  if(mode==='folders'){var g=document.getElementById('fovgrid');if(g)g.innerHTML=folderGroupsHTML()}else refreshRail();
});
document.addEventListener('keydown',function(e){
  var t=e.target;if(!t.hasAttribute||!t.hasAttribute('data-search'))return;
  if(e.key==='Escape'){t.value='';pq='';t.dispatchEvent(new Event('input',{bubbles:true}));return}
  if(e.key==='Enter'){
    var first=sortedProjects().filter(function(p){return pq&&pqMatch(p)})[0];
    if(first){e.preventDefault();sel=first.id;mode='edit';pq='';render();window.scrollTo(0,0)}
  }
});
document.addEventListener('click',function(e){
  var x=e.target.closest&&e.target.closest('[data-pqx]');if(!x)return;
  var i=x.parentNode.querySelector('input');i.value='';pq='';i.dispatchEvent(new Event('input',{bubbles:true}));i.focus();
});
var topBtn=document.getElementById('totop');
function paintTop(){topBtn.classList.toggle('on',window.scrollY>500)}
window.addEventListener('scroll',paintTop,{passive:true});
topBtn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
/* magnifier: jump to the project search box (record page or folder overview) */
function openFind(){
  if(mode!=='edit'&&mode!=='folders'){mode='edit';render()}
  if(mode==='folders'&&fsel){fsel=null;fgal=false;render()}
  window.scrollTo({top:0,behavior:'smooth'});
  var i=document.getElementById(mode==='folders'?'fsearch':'psearch');
  if(i){setTimeout(function(){i.focus();i.select()},250);var w=i.closest('.psearch');if(w){w.classList.remove('flash');void w.offsetWidth;w.classList.add('flash')}}
}
document.getElementById('tofind').addEventListener('click',openFind);
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();openFind()}});
window.addEventListener('online',function(){SY.err='';schedule()});
(function(){
  var b=document.getElementById('setdir');
  if(!window.showDirectoryPicker||!window.showOpenFilePicker)return;
  b.hidden=false;
  getHikDir().then(function(h){if(h)b.textContent='โฟลเดอร์รูป: '+h.name});
  b.addEventListener('click',function(){
    window.showDirectoryPicker({id:'cctv-dir',mode:'read'}).then(function(h){
      return tx('readwrite',function(st){return st.put({id:'__dir',handle:h})}).then(function(){b.textContent='โฟลเดอร์รูป: '+h.name;toast('ตั้งโฟลเดอร์รูปเป็น '+h.name+' แล้ว กด เพิ่มรูป จะเปิดที่นี่')});
    }).catch(function(err){if(err&&err.name!=='AbortError')toast('เบราว์เซอร์นี้ตั้งโฟลเดอร์ไม่ได้ ให้เปิดไฟล์ HTML ที่ดาวน์โหลดด้วย Chrome หรือ Edge')});
  });
})();
})();
</script>

</html>
